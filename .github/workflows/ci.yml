name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Lets a release workflow run this exact gate, so the release path and the everyday
  # path can never drift apart.
  workflow_call:

# Cancel superseded runs, except on main, where every push keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Before Setup Node, which needs pnpm on the PATH to cache its store. The repo
      # has no `packageManager` pin, so the major is named here.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `gate` line in package.json, one step each so a failure names itself. Add a
      # check in both.
      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Duplication
        run: pnpm duplication

      - name: Typecheck
        run: pnpm typecheck

      # Needs the runner's Docker daemon: the integration project starts its own
      # throwaway Valkey.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Packed contents
        run: pnpm pack:check

      - name: Typecheck the built output
        run: pnpm typecheck:dist

      - name: Smoke the built output
        run: pnpm smoke:dist

  # The e2e project, in a job of its own: it needs the built output the Fixture app
  # imports by package name, so it builds first, and its budget is minutes rather than
  # the gate's. Same list as the `gate` line's last step.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Fixture app consumes the built output through the `exports` map.
      - name: Build
        run: pnpm build

      # Needs the runner's Docker daemon: the e2e project starts its own throwaway Valkey.
      - name: E2e
        run: pnpm test:e2e

  # The integration project against every supported server, one cell per image through
  # `CACHE_TEST_IMAGE`: the floors the README declares (Redis 6.2, Valkey 7.2) and the
  # latest of each family. `fail-fast: false`, so a command one server lacks shows up as
  # that server's cell rather than cancelling the others.
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        image:
          - valkey/valkey:7.2
          - valkey/valkey:9
          - redis:6.2
          - redis:8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Needs the runner's Docker daemon: the integration project starts its own
      # throwaway server, on the image of this cell.
      - name: Integration
        run: pnpm test:integration
        env:
          CACHE_TEST_IMAGE: ${{ matrix.image }}
